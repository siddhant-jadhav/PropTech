# ============================================
# Docker Compose - Property Management System
# ============================================
# Orchestrates three services: MySQL, Flask API, and Streamlit Frontend
# Usage: docker-compose up --build
# ============================================

version: "3.8"

services:
  # ---- MySQL Database ----
  mysql:
    image: mysql:8.0
    container_name: proptech_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - proptech_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ---- Flask Backend API ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proptech_backend
    restart: always
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      FLASK_DEBUG: ${FLASK_DEBUG}
      FLASK_HOST: ${FLASK_HOST}
      FLASK_PORT: ${FLASK_PORT}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES}
    ports:
      - "5001:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - proptech_network

  # ---- Streamlit Frontend ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proptech_frontend
    restart: always
    environment:
      BACKEND_URL: ${BACKEND_URL}
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - proptech_network

# ---- Shared Network ----
networks:
  proptech_network:
    driver: bridge

# ---- Persistent Volume for MySQL ----
volumes:
  mysql_data:
    driver: local
